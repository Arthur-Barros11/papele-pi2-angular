<app-menu></app-menu>

<main>

  <section class="login">

    <h2>Login</h2>

    <form (submit)="entrar($event)">

      <label for="email">
        E-mail:
      </label>

      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        name="email"
        autocomplete="email">

      <label for="senha">
        Senha:
      </label>

      <input
        type="password"
        id="senha"
        [(ngModel)]="senha"
        name="senha"
        autocomplete="current-password">

      <button type="submit">
        Entrar
      </button>

    </form>

    <p>
      Ainda não possui cadastro?
      <a routerLink="/clientes">
        Cadastre-se
      </a>
    </p>

  </section>

</main>

<app-footer></app-footer>
