<app-menu></app-menu>

<main>

  <section class="cadastro">

    <h2>Cadastro de Cliente</h2>

    <form (submit)="cadastrar($event)">

      <label for="nome">
        Nome:
      </label>

      <input
        type="text"
        id="nome"
        [(ngModel)]="nome"
        name="nome">

      <label for="email">
        E-mail:
      </label>

      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        name="email">

      <label for="senha">
        Senha:
      </label>

      <input
        type="password"
        id="senha"
        [(ngModel)]="senha"
        name="senha">

      <label for="cpf">
        CPF:
      </label>

      <input
        type="text"
        id="cpf"
        [(ngModel)]="cpf"
        name="cpf">

      <label for="telefone">
        Telefone:
      </label>

      <input
        type="tel"
        id="telefone"
        [(ngModel)]="telefone"
        name="telefone">
              <label for="admin" class="opcao-admin">

        <input
          type="checkbox"
          id="admin"
          [(ngModel)]="souAdmin"
          name="admin">

        Cadastrar como administrador

      </label>

      @if (souAdmin) {

        <label for="codigoAdmin">
          Código de administrador:
        </label>

        <input
          type="password"
          id="codigoAdmin"
          [(ngModel)]="codigoAdmin"
          name="codigoAdmin"
          autocomplete="off">

      }

      <button type="submit">
        Cadastrar
      </button>

    </form>

  </section>

</main>

<app-footer></app-footer>
